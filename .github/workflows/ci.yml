name: CI

on:
  push:
    branches: [main, feature]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          echo "Building project..."
          mkdir -p build
          echo "build output $(date)" > build/output.txt
          echo "Build complete."
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
          retention-days: 90

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          echo "Running tests..."
          echo "Test 1: PASSED"
          echo "Test 2: PASSED"
          echo "Test 3: PASSED"
          echo "All tests passed."
      - name: Generate test report
        run: |
          mkdir -p reports
          echo "Test Report - $(date)" > reports/test-report.txt
          echo "Tests run: 3" >> reports/test-report.txt
          echo "Tests passed: 3" >> reports/test-report.txt
          echo "Tests failed: 0" >> reports/test-report.txt
      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/
          retention-days: 90

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint check
        run: |
          echo "Running lint checks..."
          echo "No issues found."
